<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070508">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Firelight</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c" aria-label="A crackling campfire. Tap and hold to put it out or relight it; tap to poke; double-tap to add a log."></canvas>

<div id="ui" class="awake">
  <label class="intensity" title="Fire intensity">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 3.5-1.5 5-1.5 7.5 0 1.3.9 2.2 2 2.2 1.4 0 2.2-1.1 2-2.8 2.6 2 4 4.6 4 7.1 0 3.9-3 6-6.5 6S5.5 19.9 5.5 16c0-4.3 3.3-6.6 4.6-9.6.6-1.4 1.1-2.8 1.9-4.4z"/></svg>
    <input id="intensity" type="range" min="0.35" max="1.6" step="0.01" value="1" aria-label="Fire intensity">
  </label>
  <button id="mute" type="button" aria-label="Turn sound on" title="Sound">
    <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg>
    <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5c1.2 1 1.8 2.2 1.8 3.5s-.6 2.5-1.8 3.5M18.6 6c2 1.6 3 3.6 3 6s-1 4.4-3 6" fill="none" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <button id="fs" type="button" aria-label="Full screen" title="Full screen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<div id="hint" aria-live="polite"></div>

<script src="audio.js"></script>
<script src="app.js"></script>
</body>
</html>
